name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "ff63fcae-2068-4f77-bf98-c30e775e5c77"

[[kv_namespaces]]
binding = "KV"
id = "7b61ef77c76f442c8a38de45581824e6"
preview_id = "0cd1f312f273402996ceecd4d8d31336"

# Secrets — set each one with:  wrangler secret put SECRET_NAME
#
#   OPENAI_API_KEY        — Direct OpenAI API key
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   SPOTIFY_REFRESH_TOKEN
#   HASHNODE_TOKEN        — (optional) Hashnode API token

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://siddhantsancheti.com"
